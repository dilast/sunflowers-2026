<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunflower Growing Contest 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌻 Sunflower Growing Contest 2026</h1>
    <div class="view-toggle">
      <button id="garden-btn" class="toggle-btn active">Garden</button>
      <button id="chart-btn" class="toggle-btn">Growth Chart</button>
    </div>
  </header>

  <main>
    <section id="garden-view" class="view">
      <div id="garden" class="garden"></div>
    </section>

    <section id="chart-view" class="view hidden">
      <div class="metric-toggle">
        <button id="metric-height-btn" class="metric-btn active">Height</button>
        <button id="metric-bloom-btn" class="metric-btn">Bloom Width</button>
      </div>
      <div id="chart" class="chart"></div>
    </section>
  </main>

  <footer>
    <p id="last-updated"></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
